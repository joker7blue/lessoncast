<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 824" width="760" height="824" role="img" aria-labelledby="title desc">
  <title id="title">How LessonCast makes a video lesson</title>
  <desc id="desc">A textbook PDF, or page photos, go to Muse Spark, which writes the lesson. Muse Image draws the scenes while MMS on Modal speaks and times every word. SAM 3.1 cuts out the objects the voice names. Modal runs Remotion, which renders an MP4 to download and share.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffd400"/>
    </marker>
    <style>
      text { font-family: Nunito, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .node { fill: #1c2521; stroke: #2c3833; stroke-width: 1.5; }
      .title { fill: #f1efe6; font-size: 17px; font-weight: 800; }
      .text { fill: #a7b0a9; font-size: 13.5px; }
      .chip { font-size: 12px; font-weight: 700; }
      .flow { fill: none; stroke: #ffd400; stroke-width: 2; stroke-opacity: 0.85; }
      .meta rect { fill: #ffd400; fill-opacity: 0.12; stroke: #ffd400; stroke-opacity: 0.55; }
      .meta text { fill: #ffd400; }
      .modal rect { fill: #9fe870; fill-opacity: 0.12; stroke: #9fe870; stroke-opacity: 0.6; }
      .modal text { fill: #9fe870; }
      .plain rect { fill: none; stroke: #a7b0a9; stroke-opacity: 0.5; }
      .plain text { fill: #a7b0a9; }
      .note { fill: #a7b0a9; font-size: 12px; }
    </style>
  </defs>

  <rect width="760" height="824" rx="24" fill="#141b18"/>

  <!-- The pages -->
  <rect class="node" x="24" y="24" width="712" height="92" rx="14"/>
  <text class="title" x="44" y="56">A textbook PDF, or page photos</text>
  <g class="plain"><rect x="619" y="38" width="97" height="24" rx="12"/><text class="chip" x="667.5" y="54.5" text-anchor="middle">The teacher</text></g>
  <text class="text" x="44" y="82">A whole textbook as a PDF, which Muse Spark splits into lessons, or one to four page photos.</text>
  <text class="text" x="44" y="101">The teacher picks the language, the length (15 s to 3 min), the quiz and the picture style.</text>

  <path class="flow" d="M380 116V146" marker-end="url(#arrow)"/>

  <!-- Muse Spark -->
  <rect class="node" x="24" y="152" width="712" height="92" rx="14"/>
  <text class="title" x="44" y="184">Muse Spark</text>
  <g class="meta"><rect x="598" y="166" width="118" height="24" rx="12"/><text class="chip" x="657" y="182.5" text-anchor="middle">Meta Model API</text></g>
  <text class="text" x="44" y="210">Reads the pages and writes the lesson as strict JSON, in the language of home:</text>
  <text class="text" x="44" y="229">the scenes and their narration, image prompts, the objects to light up, and the quiz.</text>

  <path class="flow" d="M380 244V262M196 262H564M564 262V282" marker-end="url(#arrow)"/>
  <path class="flow" d="M196 262V282" marker-end="url(#arrow)"/>

  <!-- Muse Image and the voice, side by side -->
  <rect class="node" x="24" y="288" width="344" height="92" rx="14"/>
  <text class="title" x="44" y="320">Muse Image</text>
  <g class="meta"><rect x="230" y="302" width="118" height="24" rx="12"/><text class="chip" x="289" y="318.5" text-anchor="middle">Meta Model API</text></g>
  <text class="text" x="44" y="346">Draws scene 1, then each scene as an</text>
  <text class="text" x="44" y="365">edit of it: the same characters.</text>

  <rect class="node" x="392" y="288" width="344" height="92" rx="14"/>
  <text class="title" x="412" y="320">MMS voice on Modal</text>
  <g class="modal"><rect x="626" y="302" width="90" height="24" rx="12"/><text class="chip" x="671" y="318.5" text-anchor="middle">Open weights</text></g>
  <text class="text" x="412" y="346">MMS-TTS reads the lesson in 8 languages;</text>
  <text class="text" x="412" y="365">forced alignment times every word.</text>

  <path class="flow" d="M196 380V410" marker-end="url(#arrow)"/>

  <!-- SAM -->
  <rect class="node" x="24" y="416" width="344" height="92" rx="14"/>
  <text class="title" x="44" y="448">SAM 3.1</text>
  <g class="meta"><rect x="230" y="430" width="118" height="24" rx="12"/><text class="chip" x="289" y="446.5" text-anchor="middle">Meta Model API</text></g>
  <text class="text" x="44" y="474">Cuts out each object the voice names,</text>
  <text class="text" x="44" y="493">to light it up as the word is spoken.</text>

  <path class="flow" d="M564 380V538" marker-end="url(#arrow)"/>
  <text class="note" x="580" y="456">the voice, and when</text>
  <text class="note" x="580" y="472">each word is said</text>
  <path class="flow" d="M196 508V538" marker-end="url(#arrow)"/>

  <!-- Remotion -->
  <rect class="node" x="24" y="544" width="712" height="92" rx="14"/>
  <text class="title" x="44" y="576">Remotion on Modal</text>
  <g class="modal"><rect x="608" y="558" width="108" height="24" rx="12"/><text class="chip" x="662" y="574.5" text-anchor="middle">Modal, 8 CPUs</text></g>
  <text class="text" x="44" y="602">Modal runs Remotion 4: the scenes, the voice, the lit-up objects and karaoke subtitles,</text>
  <text class="text" x="44" y="621">then the quiz read aloud with a countdown and an end card, edited into a 480p MP4.</text>

  <path class="flow" d="M380 636V666" marker-end="url(#arrow)"/>

  <!-- The video -->
  <rect class="node" x="24" y="672" width="712" height="92" rx="14"/>
  <text class="title" x="44" y="704">Export and share the video</text>
  <g class="plain"><rect x="617" y="686" width="99" height="24" rx="12"/><text class="chip" x="666.5" y="702.5" text-anchor="middle">Under 10 MB</text></g>
  <text class="text" x="44" y="730">About 2 MB a minute, ready in two to five minutes, for 5 to 18 cents of model calls.</text>
  <text class="text" x="44" y="749">Downloaded and shared on any phone or app, a parent replays it with the child at night.</text>

  <text class="note" x="380" y="798" text-anchor="middle">Each step is a Trigger.dev task with its own retries. Supabase keeps the lessons and their files.</text>
</svg>
